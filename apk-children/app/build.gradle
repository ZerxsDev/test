plugins {
    id 'com.android.application'
}

android {
    namespace 'com.company.children'
    compileSdk 34

    defaultConfig {
        applicationId "com.company.children"   // package apk
        minSdkVersion 21                        // min SDK = API 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0.0"

        // ====== KONFIGURASI SERVER (ubah bila URL ngrok berubah) ======
        buildConfigField "String", "SERVER_URL", "\"https://friday-succulent-marigold.ngrok-free.dev\"" // LHOST
        buildConfigField "int",    "SERVER_PORT", "8000"                                                  // LPORT
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildFeatures {
        buildConfig true
    }

    lint {
        abortOnError false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    // Socket.IO client Java — komunikasi realtime dengan server parental (port 8000)
    implementation 'io.socket:socket.io-client:2.1.0'
    implementation 'org.json:json:20231013'
}
